<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Habit Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #13131a; --surface2: #1c1c27;
      --border: rgba(255,255,255,0.07); --text: #f0f0f5; --muted: #6b6b80;
      --accent: #a78bfa; --danger: #f87171; --success: #34d399;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    body::before {
      content: ''; position: fixed; width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(circle, rgba(167,139,250,0.1), transparent 70%);
      top: -150px; left: -150px; pointer-events: none;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 24px; padding: 44px 40px; width: 90%; max-width: 420px;
      position: relative; z-index: 1;
    }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo h1 {
      font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800;
    }
    .logo h1 span { color: var(--accent); }
    .logo p { color: var(--muted); font-size: 0.85rem; margin-top: 6px; }

    .flash { padding: 12px 16px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 20px; }
    .flash.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: var(--danger); }
    .flash.success { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.3); color: var(--success); }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    input {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); padding: 13px 16px;
      font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
      outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent); }

    .btn {
      width: 100%; background: var(--accent); color: #0a0a0f;
      border: none; padding: 14px; border-radius: 12px;
      font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem;
      cursor: pointer; transition: opacity 0.2s, transform 0.15s;
      margin-top: 8px;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }

    .switch { text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--muted); }
    .switch a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .switch a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>Habit <span>Tracker</span></h1>
    <p>Welcome back! Login to continue.</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST" action="/login">
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" placeholder="you@example.com" required/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required/>
    </div>
    <button type="submit" class="btn">Login →</button>
  </form>

  <div class="switch">
    Don't have an account? <a href="/register">Register here</a>
  </div>
</div>
</body>
</html>
