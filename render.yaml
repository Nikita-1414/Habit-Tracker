services:
  - type: web
    name: habit-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        value: habit-tracker-secret-key-render-2024
      - key: DB_DIR
        value: /tmp
